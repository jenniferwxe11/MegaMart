name: Data Ingestion
on:
  workflow_dispatch:
    inputs:
      dataset_size:
        description: Dataset size
        required: true
        default: ci
        type: choice

        options:
          - local
          - ci
          - full

permissions:
  contents: read
  id-token: write

env:
  DATASET_SIZE: ${{ github.event.inputs.dataset_size }}

jobs:
  data-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATASET_SIZE: ${{ inputs.dataset_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.in', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
          pip install -r requirements.txt

      - name: Validate requirements.txt
        run: |
          pip-compile requirements.in --quiet
          git diff --exit-code requirements.txt

      - name: Authenticate to Google Cloud Platform
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: projects/594876062374/locations/global/workloadIdentityPools/mega-mart-pool/providers/github
          service_account: mega-mart-service@mega-mart-storage.iam.gserviceaccount.com

      - name: Verify authentication
        run: gcloud auth list

      - name: Full Data Generation (Raw + Dirty Data)
        run: python -m run_all

      - name: Upload to BigQuery
        run: python -m data_ingestion.load_to_bigquery

      - name: Show uploaded tables
        run: |
          bq ls mega-mart-storage:raw_dev

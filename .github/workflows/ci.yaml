---
name: CI

on:
  push:
    branches:
      - feature/**
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATASET_SIZE: ci

jobs:
  # --- CHANGE DETECTION ---
  changes:
    runs-on: ubuntu-latest

    outputs:
      python: ${{ steps.filter.outputs.python }}
      test: ${{ steps.filter.outputs.test }}
      dbt: ${{ steps.filter.outputs.dbt }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
            test:
              - 'data_generation/**/*.py'
              - 'tests/**/*.py'
            dbt:
              - 'models/**'
              - 'seeds/**'
              - 'snapshots/**'
              - 'dbt_project.yml'

  # --- CI ---
  ci:
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 20
    if: needs.changes.outputs.python == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v44

      - name: Display changed files
        run: |
          echo "Changed files:"
          echo "${{ steps.changes.outputs.all_changed_files }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.in', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools
          pip install pip-tools
          pip install -r requirements.txt

      - name: Validate requirements.txt
        run: |
          pip-compile requirements.in --quiet
          git diff --exit-code requirements.txt

      - name: Run pre-commit hooks (lint, format)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Dependency security scan
        run: pip-audit

      - name: Code security scan (Bandit)
        run: |
          FILES="${{ steps.changes.outputs.all_changed_files }}"

          PY_FILES=$(echo "$FILES" \
            | tr ' ' '\n' \
            | grep '^data_generation/.*\.py$\|^tests/.*\.py$' \
            || true)

          if [ -z "$PY_FILES" ]; then
            echo "No Python changes → skipping bandit"
            exit 0
          fi

          echo "$PY_FILES"

          echo "$PY_FILES" | xargs -r bandit -c .bandit

      - name: Install Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for secrets
        run: gitleaks detect --source . --exit-code 2 --redact

      - name: Generate Synthetic Test Data
        env:
          DATASET_SIZE: ${{ env.DATASET_SIZE }}
        if: needs.changes.outputs.test == 'true'
        run: |
          python -m data_generation.generation_runner

      - name: Run tests
        if: needs.changes.outputs.test == 'true'
        run: pytest

  # --- DBT ---
  dbt:
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 20
    if: needs.changes.outputs.dbt == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v44

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.in', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
          pip install -r requirements.txt

      - name: Install dbt dependencies
        run: dbt deps

      - name: Download previous dbt artifacts
        uses: actions/download-artifact@v4
        with:
          name: dbt-target
          path: target
        continue-on-error: true

      - name: Check modified dbt files
        id: dbt-files
        run: |
          FILES="${{ steps.changes.outputs.all_changed_files }}"

          DBT_FILES=$(echo "$FILES" \
            | tr ' ' '\n' \
            | grep -E '^models/|^seeds/|^snapshots/|^dbt_project.yml' \
            || true)

          if [ -z "$DBT_FILES" ]; then
            echo "dbt_changed=false" >> $GITHUB_OUTPUT
          else
            echo "dbt_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Parse dbt project
        if: steps.dbt-files.outputs.dbt_changed == 'true'
        run: |
          dbt parse

      - name: Compile dbt models
        if: steps.dbt-files.outputs.dbt_changed == 'true'
        run: |
          dbt compile

      - name: Upload dbt target artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: target/

      - name: Upload dbt logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-logs
          path: logs/

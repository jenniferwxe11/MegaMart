version: 2

models:
  # --- CLICKSTREAM BUNDLES ---
  - name: clickstream_bundles

    # --- Business Rules ---
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - clickstream_id
              - bundle_id

          config:
            meta:
              title: Duplicate Clickstream Bundle
              category: Business Rule Violations
              severity: High
              description: A bundle_id must only appear once per clickstream event.

    # --- Column Constraints ---
    columns:
      - name: clickstream_id
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Clickstream ID
                  category: Missing Values
                  severity: High
                  description: clickstream_id is required.

          - relationships:
              arguments:
                to: ref('clickstreams')
                field: clickstream_id

              config:
                meta:
                  title: Invalid Clickstream Reference
                  category: Referential Integrity
                  severity: High
                  description: clickstream_id must exist in the clickstreams table.

      - name: bundle_id
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Bundle ID
                  category: Missing Values
                  severity: High
                  description: bundle_id is required.

          - relationships:
              arguments:
                to: ref('bundles')
                field: bundle_id

              config:
                meta:
                  title: Invalid Bundle Reference
                  category: Referential Integrity
                  severity: High
                  description: bundle_id must exist in the bundles table.

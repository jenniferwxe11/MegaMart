version: 2

models:
  # --- CLICKSTREAM PROMOTIONS ---
  - name: clickstream_promotions

    # --- Business Rules ---
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - clickstream_id
              - promotion_id

          config:
            meta:
              title: Duplicate Clickstream Promotion
              category: Business Rule Violations
              severity: High
              description: A promotion_id must only appear once per clickstream event.

    # --- Column Constraints ---
    columns:
      - name: clickstream_id
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Clickstream ID
                  category: Missing Values
                  severity: High
                  description: clickstream_id is required.

          - relationships:
              arguments:
                to: ref('clickstreams')
                field: clickstream_id

              config:
                meta:
                  title: Invalid Clickstream Reference
                  category: Referential Integrity
                  severity: High
                  description: clickstream_id must exist in the clickstreams table.

      - name: promotion_id
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Promotion ID
                  category: Missing Values
                  severity: High
                  description: promotion_id is required.

          - relationships:
              arguments:
                to: ref('promotions')
                field: promotion_id

              config:
                meta:
                  title: Invalid Promotion Reference
                  category: Referential Integrity
                  severity: High
                  description: promotion_id must exist in the promotions table.

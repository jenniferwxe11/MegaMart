# dbt/models/customers/customers.yml

version: 2

models:
  - name: customers

    # --- Business Rules ---
    tests:
      - customers_area_region_match:
          arguments:
            mapping_model: ref('region_area_mapping')

          config:
            meta:
              title: Area Region Mismatch
              category: Business Rule Violations
              severity: Medium
              description: Every area must belong to its assigned region.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_name IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Customer Name
              category: Missing Values
              severity: Low
              description: customer_name must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              email IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Email
              category: Missing Values
              severity: Medium
              description: email must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              gender IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Gender
              category: Missing Values
              severity: Low
              description: gender must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              dob IS NULL
              OR (
                dob <= current_date()
                AND dob >= DATE '1900-01-01'
              )

          config:
            meta:
              title: Date of Birth Out of Valid Range
              category: Date Issues
              severity: Low
              description: dob must not be in the future or earlier than 1900-01-01.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              dob IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Date of Birth
              category: Missing Values
              severity: Medium
              description: dob must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              signup_date IS NULL
              OR signup_date <= current_date()

          config:
            meta:
              title: Future Signup Date
              category: Date Issues
              severity: High
              description: signup_date must not be in the future.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              dob IS NULL
              OR signup_date IS NULL
              OR dob <= signup_date

          config:
            meta:
              title: Signup Date before Date of Birth
              category: Business Rule Violations
              severity: High
              description: signup_date must occur on or after dob.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              dob IS NULL
              OR signup_date IS NULL
              OR DATE_DIFF(signup_date, dob, YEAR) >= 18

          config:
            meta:
              title: Underage Customer at Signup
              category: Business Rule Violations
              severity: High
              description: Customer must be at least 18 years old when registering an account.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              area IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Area
              category: Missing Values
              severity: Low
              description: area must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              region IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Region
              category: Missing Values
              severity: Low
              description: region must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_segment IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Customer Segment
              category: Missing Values
              severity: High
              description: customer_segment must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              email_marketing_opt_in IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Email Marketing Preference
              category: Missing Values
              severity: High
              description: email_marketing_opt_in must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_type IN ('Retail Walk-In','Retail Members')
              OR COALESCE(email_marketing_opt_in, FALSE) IS FALSE
              OR email IS NOT NULL

          config:
            meta:
              title: Email Marketing without Email
              category: Business Rule Violations
              severity: High
              description: email must be populated when email_marketing_opt_in is TRUE.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              sms_marketing_opt_in IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing SMS Marketing Preference
              category: Missing Values
              severity: High
              description: sms_marketing_opt_in must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              push_notifications_opt_in IS NOT NULL
              OR customer_type IN ('Retail Walk-In', 'Retail Members')

          config:
            meta:
              title: Missing Push Notifications Marketing Preference
              category: Missing Values
              severity: High
              description: push_notifications_opt_in must be populated for Online Only and Omnichannel customers.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              customer_type IN ('Retail Walk-In','Retail Members')
              OR COALESCE(push_notifications_opt_in, FALSE) IS FALSE
              OR device_platform IS NOT NULL

          config:
            meta:
              title: Push Notifications Marketing without Device Platform
              category: Business Rule Violations
              severity: High
              description: device_platform must be populated when push_notifications_opt_in is TRUE.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              device_category IS NOT NULL
              OR device_platform IS NULL

          config:
            meta:
              title: Missing Device Category
              category: Missing Values
              severity: Medium
              description: device_category must be populated when device_platform is populated.

    # --- Column Constraints ---
    columns:
      - name: customer_id
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Customer ID
                  category: Missing Values
                  severity: High
                  description: customer_id is required.

          - unique:
              config:
                meta:
                  title: Duplicate Customer ID
                  category: Duplicate Records
                  severity: High
                  description: customer_id must be unique.

          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^CUST[0-9]{3,}$"

              config:
                meta:
                  title: Invalid Customer ID Format
                  category: Formatting
                  severity: High
                  description: customer_id must follow the expected format.

      - name: customer_type
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Customer Type
                  category: Missing Values
                  severity: High
                  description: customer_type is required.

          - accepted_values:
              arguments:
                values:
                  [
                    "Retail Walk-In",
                    "Retail Members",
                    "Online Only",
                    "Omnichannel",
                  ]

              config:
                meta:
                  title: Invalid Customer Type
                  category: Data Quality
                  severity: High
                  description: customer_type must be one of the supported values.

      - name: customer_name
        tests:
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: ^[A-Za-z]+(?:[ '-][A-Za-z]+)*$

              config:
                meta:
                  title: Invalid Customer Name Format
                  category: Formatting
                  severity: Low
                  description: customer_name must follow the expected format and must not have leading/trailing whitespace.

      - name: email
        tests:
          - unique:
              config:
                where: "email IS NOT NULL"

                meta:
                  title: Duplicate Email
                  category: Duplicate Records
                  severity: High
                  description: email must be unique.

          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: ^[^\s@]+@[^\s@]+\.[^\s@]+$

              config:
                meta:
                  title: Invalid Email Format
                  category: Formatting
                  severity: High
                  description: email must follow the expected format and must not have leading/trailing whitespace.

      - name: gender
        tests:
          - accepted_values:
              arguments:
                values: ["Female", "Male"]

              config:
                meta:
                  title: Invalid Gender
                  category: Data Quality
                  severity: Low
                  description: gender must either be 'Female' or 'Male'.

      - name: dob
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: DATE

              config:
                meta:
                  title: Invalid Date of Birth Type
                  category: Date Type
                  severity: Low
                  description: dob must be stored as a DATE.

      - name: area
        tests: []

      - name: region
        tests: []

      - name: signup_date
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: DATE

              config:
                meta:
                  title: Invalid Signup Date Type
                  category: Date Type
                  severity: Medium
                  description: signup_date must be stored as a DATE.

      - name: customer_segment
        tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "New Customers",
                    "Active Customers",
                    "Churn Risk Customers",
                    "High Spenders",
                    "Budget Shoppers",
                  ]

              config:
                meta:
                  title: Invalid Customer Segment
                  category: Data Quality
                  severity: Medium
                  description: customer_segment must be one of the supported values.

      - name: email_marketing_opt_in
        tests:
          - accepted_values:
              arguments:
                quote: false
                values: [true, false]

              config:
                meta:
                  title: Invalid Email Marketing Preference
                  category: Data Quality
                  severity: Low
                  description: email_marketing_opt_in must either be TRUE or FALSE.

      - name: sms_marketing_opt_in
        tests:
          - accepted_values:
              arguments:
                quote: false
                values: [true, false]

              config:
                meta:
                  title: Invalid SMS Marketing Preference
                  category: Data Quality
                  severity: Low
                  description: sms_marketing_opt_in must either be TRUE or FALSE.

      - name: push_notifications_opt_in
        tests:
          - accepted_values:
              arguments:
                quote: false
                values: [true, false]

              config:
                meta:
                  title: Invalid Push Notifications Marketing Preference
                  category: Data Quality
                  severity: Low
                  description: push_notifications_opt_in must either be TRUE or FALSE.


      - name: device_category
        tests:
          - accepted_values:
              arguments:
                values: ["Mobile", "Desktop", "Tablet"]

              config:
                meta:
                  title: Invalid Device Category
                  category: Data Quality
                  severity: Low
                  description: device_category must be one of the supported values.


      - name: device_platform
        tests:
          - accepted_values:
              arguments:
                values: ["iOS", "Android", "Web"]

              config:
                meta:
                  title: Invalid Device Platform
                  category: Data Quality
                  severity: Low
                  description: device_platform must be one of the supported values.

version: 2

models:
  # --- PRODUCT CONTENT QUALITY ---
  - name: product_content_quality

    # --- Business Rules ---
    tests:
      - single_current_product_content_quality_version:
          config:
            meta:
              title: Multiple Current Versions
              category: Business Rule Violations
              severity: High
              description: Every product must have only one current content quality version.

      - non_overlapping_product_content_quality_versions:
          config:
            meta:
              title: Overlapping Validity Periods
              category: Business Rule Violations
              severity: High
              description: Content quality versions for a product must not overlap.

      - product_content_quality_tier_rules:
          config:
            meta:
              title: Content Quality Tier Characteristics
              category: Business Rule Violations
              severity: Medium
              description: Product content metrics must fall within the expected ranges for the assigned quality tier.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              COALESCE(has_image, FALSE) = FALSE
              OR image_count > 0

          config:
            meta:
              title: Image Indicator with Images
              category: Business Rule Violations
              severity: Medium
              description: has_image must be TRUE when image_count is greater than 0.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              COALESCE(has_image, TRUE) = TRUE
              OR image_count = 0

          config:
            meta:
              title: Image Indicator without Images
              category: Business Rule Violations
              severity: Medium
              description: has_image must be FALSE when image_count is 0.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              COALESCE(has_description, FALSE) = FALSE
              OR description_length > 0

          config:
            meta:
              title: Description Indicator with Description
              category: Business Rule Violations
              severity: Medium
              description: has_description must be TRUE when description_length is greater than 0.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              COALESCE(has_description, TRUE) = TRUE
              OR description_length = 0

          config:
            meta:
              title: Description Indicator without Description
              category: Business Rule Violations
              severity: Medium
              description: has_description must be FALSE when description_length is 0.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              valid_to IS NULL
              OR valid_to >= valid_from

          config:
            meta:
              title: Invalid Validity Period
              category: Business Rule Violations
              severity: High
              description: valid_to must occur on or after valid_from.

      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              COALESCE(is_current, FALSE) = FALSE
              OR valid_to IS NULL

          config:
            meta:
              title: Current Record with End Date
              category: Business Rule Violations
              severity: High
              description: valid_to must be NULL when is_current is TRUE.

    # --- Column Constraints ---
    columns:
      - name: content_version_id
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Content Version ID
                  category: Missing Values
                  severity: High
                  description: content_version_id is required.

          - unique:
              config:
                meta:
                  title: Duplicate Content Version ID
                  category: Duplicate Records
                  severity: High
                  description: content_version_id must be unique.

          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^PCQ[0-9]{7,}$"

              config:
                meta:
                  title: Invalid Content Version ID Format
                  category: Formatting
                  severity: High
                  description: content_version_id must follow the expected format.

      - name: product_id
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Product ID
                  category: Missing Values
                  severity: High
                  description: product_id is required.

          - relationships:
              arguments:
                to: ref('products')
                field: product_id

              config:
                meta:
                  title: Invalid Product Reference
                  category: Referential Integrity
                  severity: High
                  description: product_id must exist in the products table.

      - name: quality_tier
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Quality Tier
                  category: Missing Values
                  severity: High
                  description: quality_tier is required.

          - accepted_values:
              arguments:
                values: ["Poor", "Average", "Good", "Excellent"]

              config:
                meta:
                  title: Invalid Quality Tier
                  category: Data Quality
                  severity: Low
                  description: quality_tier must be one of the supported values.

      - name: has_image
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Image Indicator
                  category: Missing Values
                  severity: Medium
                  description: has_image is required.

          - accepted_values:
              arguments:
                quote: false
                values: [true, false]

              config:
                meta:
                  title: Invalid Image Indicator
                  category: Data Quality
                  severity: Low
                  description: has_image must either be TRUE or FALSE.

      - name: image_count
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Image Count
                  category: Missing Values
                  severity: High
                  description: image_count is required.

          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000
                strictly: false

              config:
                meta:
                  title: Image Count Out of Valid Range
                  category: Range Validation
                  severity: Medium
                  description: image_count must be between 0 and 100000.

      - name: image_quality_score
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                strictly: false

              config:
                meta:
                  title: Image Quality Score Out of Valid Range
                  category: Range Validation
                  severity: Low
                  description: image_quality_score must be between 0 and 1.

      - name: has_nutritional_info
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Nutritional Information Indicator
                  category: Missing Values
                  severity: Low
                  description: has_nutritional_info is required.

          - accepted_values:
              arguments:
                quote: false
                values: [true, false]

              config:
                meta:
                  title: Invalid Nutritional Information Indicator
                  category: Data Quality
                  severity: Low
                  description: has_nutritional_info must either be TRUE or FALSE.

      - name: has_description
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Description Indicator
                  category: Missing Values
                  severity: Medium
                  description: has_description is required.

          - accepted_values:
              arguments:
                quote: false
                values: [true, false]

              config:
                meta:
                  title: Invalid Description Indicator
                  category: Data Quality
                  severity: Low
                  description: has_description must either be TRUE or FALSE.

      - name: description_length
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Description Length
                  category: Missing Values
                  severity: Medium
                  description: description_length is required.

          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000
                strictly: false

              config:
                meta:
                  title: Description Length Out of Valid Range
                  category: Range Validation
                  severity: Medium
                  description: description_length must be between 0 and 100000.

      - name: missing_attribute_count
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Attribute Count
                  category: Missing Values
                  severity: Medium
                  description: missing_attribute_count is required.

          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000
                strictly: false

              config:
                meta:
                  title: Missing Attribute Count Out of Valid Range
                  category: Range Validation
                  severity: Medium
                  description: missing_attribute_count must be between 0 and 100000.

      - name: valid_from
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Valid From
                  category: Missing Values
                  severity: High
                  description: valid_from is required.

          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: DATE

              config:
                meta:
                  title: Invalid Valid From Type
                  category: Date Type
                  severity: Low
                  description: valid_from must be stored as a DATE.

          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= current_date()"

              config:
                meta:
                  title: Future Valid From
                  category: Date Issues
                  severity: Medium
                  description: valid_from must not be in the future.

      - name: valid_to
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: DATE

              config:
                meta:
                  title: Invalid Valid To Type
                  category: Date Type
                  severity: Low
                  description: valid_to must be stored as a DATE.

      - name: is_current
        tests:
          - not_null:
              config:
                meta:
                  title: Missing Current Status
                  category: Missing Values
                  severity: Medium
                  description: is_current is required.

          - accepted_values:
              arguments:
                quote: false
                values: [true, false]

              config:
                meta:
                  title: Invalid Current Status
                  category: Data Quality
                  severity: Medium
                  description: is_current must either be TRUE or FALSE.
